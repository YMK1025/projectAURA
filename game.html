/* 엔딩 결정: tags와 최종 stats 기반 */
function determineEnding(stats, tags) {
  if (ENDINGS.rampage.condition(stats, tags))     return 'rampage';
  if (ENDINGS.reform_hero.condition(stats, tags)) return 'reform_hero';
  if (ENDINGS.lone_guardian.condition(stats, tags)) return 'lone_guardian';
  return 'default_end';
}

/* 스탯별 색상 */
function statColor(stat) {
  return { power: '#ff6b6b', control: '#4fc3f7', mental: '#ce93d8' }[stat] || '#fff';
}

/* 선택지 요구 조건 충족 여부 */
function meetsReq(choice, stats) {
  if (!choice.req) return true;
  return (stats[choice.req.stat] || 0) >= choice.req.min;
}

/* 스탯 변화 적용 (0~MAX_STAT 범위 유지) */
function applyChanges(current, changes) {
  const next = { ...current };
  for (const [s, v] of Object.entries(changes || {})) {
    if (next[s] !== undefined) next[s] = Math.max(0, Math.min(MAX_STAT, (next[s] || 0) + (v || 0)));
  }
  return next;
}

/* =====================================================================
   COMPONENTS
   ===================================================================== */

/* 스탯 바 하나 */
function StatBar({ label, value, stat }) {
  const color = statColor(stat);
  const pct = Math.min(100, (value / MAX_STAT) * 100);
  return (
    <div style={{ marginBottom: 6 }}>
      <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, marginBottom:2, color:'#9090b0' }}>
        <span>{label}</span>
        <span style={{ color }}>{value}/{MAX_STAT}</span>
      </div>
      <div style={{ background:'#1a1a3a', borderRadius:4, height:6, overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', background:color, borderRadius:4, transition:'width 0.6s ease' }} />
      </div>
    </div>
  );
}

    }}>
      <div style={{
        maxWidth:460, width:'100%', textAlign:'center',
        opacity: show ? 1 : 0, transform: show ? 'translateY(0)' : 'translateY(20px)',
        transition:'all 0.7s ease'
      }}>
        <div style={{ fontSize:11, color:'#4caf50', letterSpacing:4, marginBottom:8 }}>챕터 {chapterNum} 완료</div>
        <h2 style={{ fontSize:22, color:'#fff', marginBottom:4 }}>{ch?.title}</h2>
        <div style={{ fontSize:13, color:'#505050', marginBottom:28 }}>{ch?.subtitle}</div>

        <div style={{
          background:'rgba(255,255,255,0.03)', border:'1px solid rgba(76,175,80,0.25)',
          borderRadius:12, padding:20, marginBottom:24
        }}>
          <div style={{ fontSize:12, color:'#4caf50', marginBottom:14 }}>능력 성장</div>
          {['power','control','mental'].map(stat => {
            const labels = { power:'⚡ 파워', control:'🎯 컨트롤', mental:'🧘 멘탈' };
            const v = statChanges[stat] || 0;
            return (
              <div key={stat} style={{ marginBottom:10 }}>
                <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, marginBottom:4 }}>
                  <span style={{ color:'#9090b0' }}>{labels[stat]}</span>
                  <span style={{ color: v > 0 ? '#4caf50' : v < 0 ? '#f44336' : '#5050a0' }}>
                    {v > 0 ? `+${v}` : v < 0 ? v : '—'} → {stats[stat]}
                  </span>
                </div>
                <div style={{ background:'#1a1a3a', borderRadius:4, height:6 }}>
                  <div style={{ width:`${(stats[stat]/MAX_STAT)*100}%`, height:'100%', background:statColor(stat), borderRadius:4, transition:'width 1s ease' }} />
                </div>
              </div>
            );
          })}
        </div>

        <button
          onClick={onContinue}
          style={{
            padding:'13px 40px',
            background:'linear-gradient(135deg,#4caf50,#2e7d32)',
            border:'none', borderRadius:10,
            color:'#fff', fontSize:15, fontWeight:'bold',
            cursor:'pointer', fontFamily:'inherit', letterSpacing:1
          }}
        >
          다음 챕터로 →
        </button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 스토리 진행 화면 */
function StoryScreen({ chapter, scene, stats, ability, playerName, chapterNum, onChoice }) {
  const [flash, setFlash] = useState(''); // 선택 후 결과 텍스트
  const [locked, setLocked] = useState(false);

  /* **bold** 마크업 파싱 */
  function parseText(text) {
    return text.split(/(\*\*[^*]+\*\*)/g).map((p, i) =>
      p.startsWith('**')
        ? <strong key={i} style={{ color:'#e0e0ff' }}>{p.slice(2,-2)}</strong>
        : p
    );
  }

  function handleClick(choice) {
    if (locked || !meetsReq(choice, stats)) return;
    setLocked(true);
    setFlash(choice.result);
    setTimeout(() => {
      setFlash('');
      setLocked(false);
      onChoice(choice);
    }, 1400);
  }

  return (
    <div style={{
      minHeight:'100vh', background:'linear-gradient(180deg,#080818 0%,#0a0a20 100%)',
      padding:16, display:'flex', flexDirection:'column', alignItems:'center'
    }}>
      <div style={{ maxWidth:600, width:'100%' }}>
        <HUD stats={stats} ability={ability} playerName={playerName} chapterNum={chapterNum} />

        <div style={{ marginBottom:14, paddingBottom:10, borderBottom:'1px solid #1a1a3a' }}>
          <div style={{ fontSize:11, color:'#7c4dff', letterSpacing:3 }}>
            챕터 {chapterNum} — {chapter.title}
          </div>
        </div>

        {/* 스토리 본문 */}
        <div style={{
          background:'rgba(255,255,255,0.03)', border:'1px solid #181828',
          borderRadius:12, padding:'20px 24px', marginBottom:18,
          fontSize:14, lineHeight:1.95, color:'#b0b0d0',
          whiteSpace:'pre-line', animation:'fadeIn 0.4s ease'
        }}>
          {parseText(scene.text)}
        </div>

        {/* 결과 플래시 */}
        {flash && (
          <div style={{
            background:'rgba(124,77,255,0.1)', border:'1px solid rgba(124,77,255,0.3)',
            borderRadius:8, padding:'12px 16px', marginBottom:14,
            fontSize:13, color:'#b090ff', fontStyle:'italic',
            animation:'fadeIn 0.3s ease'
          }}>
            {flash}
          </div>
        )}

        {/* 선택지 버튼들 */}
        {!locked && (
          <div style={{ display:'flex', flexDirection:'column', gap:10, animation:'fadeIn 0.4s ease' }}>
            {scene.choices.map((choice, i) => {
              const ok = meetsReq(choice, stats);
              return (
                <button
                  key={i}
                  onClick={() => handleClick(choice)}
                  style={{
                    padding:'14px 18px',
                    background: ok ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)',
                    border:`1px solid ${ok ? 'rgba(124,77,255,0.4)' : 'rgba(50,50,70,0.5)'}`,
                    borderRadius:10, color: ok ? '#c8c8e8' : '#454560',
                    fontSize:13, lineHeight:1.5,
                    cursor: ok ? 'pointer' : 'not-allowed',
                    textAlign:'left', fontFamily:'inherit',
                    transition:'background 0.2s ease',
                    display:'flex', alignItems:'flex-start', gap:12
                  }}
                  onMouseEnter={e => ok && (e.currentTarget.style.background='rgba(124,77,255,0.12)')}
                  onMouseLeave={e => ok && (e.currentTarget.style.background='rgba(255,255,255,0.05)')}
                >
                  <span style={{ color: ok ? '#7c4dff' : '#303050', fontWeight:'bold', minWidth:18 }}>
                    {String.fromCharCode(65+i)}
                  </span>
                  <span>
                    {choice.text}
                    {/* 잠긴 선택지 조건 표시 */}
                    {choice.req && !ok && (
                      <span style={{ display:'block', fontSize:11, color:'#e57373', marginTop:4 }}>
                        🔒 {choice.req.stat === 'power' ? '파워' : choice.req.stat === 'control' ? '컨트롤' : '멘탈'} {choice.req.min} 이상 필요
                      </span>
                    )}
                    {/* 스탯 변화 미리보기 */}
                    {ok && (
                      <span style={{ display:'block', fontSize:11, marginTop:4, opacity:0.7 }}>
                        {Object.entries(choice.statChanges||{}).map(([s,v]) => (
                          <span key={s} style={{ color: v>0 ? '#81c784' : '#e57373', marginRight:8 }}>
                            {s==='power'?'⚡':s==='control'?'🎯':'🧘'}{v>0?`+${v}`:v}
                          </span>
                        ))}
                      </span>
                    )}
                  </span>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* 엔딩 화면 */
function EndingScreen({ endingKey, stats, ability, playerName, onRestart }) {
  const ending = ENDINGS[endingKey];
  const ab = ABILITIES[ability];
  const [show, setShow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setShow(true), 200); return () => clearTimeout(t); }, []);

  return (
    <div style={{
      minHeight:'100vh',
      background:`linear-gradient(135deg,#080818 0%,${ending.color}12 100%)`,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:24
    }}>
      <div style={{
        maxWidth:500, width:'100%', textAlign:'center',
        opacity: show?1:0, transform: show?'translateY(0)':'translateY(20px)',
        transition:'all 0.8s ease'
      }}>
        <div style={{ fontSize:52, marginBottom:16 }}>{ending.emoji}</div>
        <div style={{ fontSize:11, color:ending.color, letterSpacing:4, marginBottom:8 }}>ENDING</div>
        <h2 style={{
          fontSize:24, color:'#fff', marginBottom:24,
          textShadow:`0 0 24px ${ending.color}70`
        }}>{ending.title}</h2>

        <div style={{
          background:'rgba(255,255,255,0.04)', border:`1px solid ${ending.color}28`,
          borderRadius:12, padding:24, marginBottom:22,
          fontSize:14, lineHeight:2, color:'#b0b0d0',
          whiteSpace:'pre-line', textAlign:'left'
        }}>
          {ending.description}
        </div>

        {/* 최종 스탯 */}
        <div style={{
          background:'rgba(255,255,255,0.03)', border:'1px solid #252535',
          borderRadius:12, padding:20, marginBottom:24
        }}>
          <div style={{ fontSize:12, color:'#5050a0', marginBottom:14 }}>
            최종 스탯 — {ab?.emoji} {playerName}
          </div>
          {[['power','⚡ 파워'],['control','🎯 컨트롤'],['mental','🧘 멘탈']].map(([s,l]) => (
            <div key={s} style={{ marginBottom:10 }}>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, marginBottom:4 }}>
                <span style={{ color:'#8080a0' }}>{l}</span>
                <span style={{ color:statColor(s) }}>{stats[s]}</span>
              </div>
              <div style={{ background:'#1a1a3a', borderRadius:4, height:6 }}>
                <div style={{ width:`${(stats[s]/MAX_STAT)*100}%`, height:'100%', background:statColor(s), borderRadius:4 }} />
              </div>
            </div>
          ))}
        </div>

        <button
          onClick={onRestart}
          style={{
            padding:'13px 40px',
            background:'rgba(255,255,255,0.05)', border:`1px solid ${ending.color}40`,
            borderRadius:10, color:'#b0b0d0',
            fontSize:14, cursor:'pointer', fontFamily:'inherit', letterSpacing:1,
            transition:'background 0.2s ease'
          }}
          onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,0.1)'}
          onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,0.05)'}
        >
          처음부터 다시하기
        </button>
      </div>
    </div>
  );
}

/* =====================================================================
   MAIN GAME STATE MACHINE
   ===================================================================== */
function Game() {
  const [screen, setScreen]       = useState('title');      // title|awakening|story|transition|ending
  const [playerName, setName]     = useState('');
  const [ability, setAbility]     = useState(null);
  const [stats, setStats]         = useState({ power:0, control:0, mental:0 });
  const [chapterIdx, setChIdx]    = useState(0);            // 0-based index into CHAPTERS
  const [sceneIdx, setScIdx]      = useState(0);
  const [tags, setTags]           = useState([]);           // 누적 선택 태그 (엔딩 분기 결정용)
  const [chDelta, setChDelta]     = useState({ power:0, control:0, mental:0 }); // 챕터 내 스탯 변화 누적
  const [endingKey, setEndKey]    = useState(null);

  /* 능력 선택 → 초기 스탯 설정 후 스토리 시작 */
  function onAwakening(key) {
    setAbility(key);
    setStats({ ...ABILITIES[key].initStats });
    setScreen('story');
  }

  /* 선택지 클릭 처리 */
  function onChoice(choice) {
    /* 1. 스탯 반영 */
    const newStats = applyChanges(stats, choice.statChanges);
    setStats(newStats);

    /* 2. 챕터 내 변화량 누적 */
    const delta = { ...chDelta };
    for (const [s, v] of Object.entries(choice.statChanges || {})) {
      if (delta[s] !== undefined) delta[s] = (delta[s] || 0) + (v || 0);
    }
    setChDelta(delta);

    /* 3. 선택 태그 누적 */
    const newTags = choice.tag ? [...tags, choice.tag] : tags;
    setTags(newTags);

    /* 4. 다음 상태 결정 */
    if (choice.next === 'chapter_end') {
      setScreen('transition');
    } else if (choice.next === 'ending') {
      setEndKey(determineEnding(newStats, newTags));
      setScreen('ending');
    } else {
      setScIdx(choice.next);
    }
  }

  /* 챕터 전환 → 다음 챕터 or 엔딩 */
  function onTransitionContinue() {
    const next = chapterIdx + 1;
    if (next >= CHAPTERS.length) {
      setEndKey(determineEnding(stats, tags));
      setScreen('ending');
    } else {
      setChIdx(next);
      setScIdx(0);
      setChDelta({ power:0, control:0, mental:0 });
      setScreen('story');
    }
  }

  /* 재시작 */
  function onRestart() {
    setScreen('title'); setName(''); setAbility(null);
    setStats({ power:0, control:0, mental:0 });
    setChIdx(0); setScIdx(0); setTags([]); setChDelta({ power:0, control:0, mental:0 }); setEndKey(null);
  }

  const chapter = CHAPTERS[chapterIdx];
  const scene   = chapter?.scenes[sceneIdx];

  if (screen === 'title')     return <TitleScreen onStart={n => { setName(n); setScreen('awakening'); }} />;
  if (screen === 'awakening') return <AwakeningScreen onChoose={onAwakening} />;
  if (screen === 'story' && chapter && scene)
    return <StoryScreen chapter={chapter} scene={scene} stats={stats} ability={ability}
                        playerName={playerName} chapterNum={chapterIdx+1} onChoice={onChoice} />;
  if (screen === 'transition')
    return <ChapterTransition chapterNum={chapterIdx+1} statChanges={chDelta} stats={stats} onContinue={onTransitionContinue} />;
  if (screen === 'ending')
    return <EndingScreen endingKey={endingKey} stats={stats} ability={ability} playerName={playerName} onRestart={onRestart} />;

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Game />);
</script>
