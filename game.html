    choices:[{ text:'"알겠습니다." — 무겁게 받아들인다', result:'능력의 윤리를 처음으로 실감했다.', statChanges:{mental:2,control:2}, next:'chapter_end' }]
  },
  { id:13, abilityScene:'regeneration',
    text:`드론이 정면으로 당신의 가슴을 친다.\n\n격리 유리 너머에서 민이 소리를 지른다. 리온이 비상 버튼으로 달려간다.\n\n당신은 멀쩡하다. 드론이 박살났다. 당신 가슴팍의 옷에는 충돌 흔적이 있지만, 피부는 멀쩡하다. 심지어 멍도 없다.\n\n리온이 멈춘다. 비상 버튼에서 손을 뗀다. 천천히 당신에게 걸어온다.\n\n그는 오랫동안 당신을 바라본다.\n\n"훈련 방식을 바꿔야겠어. 너한테는 일반 드론은 의미가 없겠어."`,
    choices:[{ text:'"...저도 그렇게 생각했습니다."', result:'이후 당신의 훈련 강도는 두 배가 됐다.', statChanges:{power:3,mental:1}, next:'chapter_end' }]
  },
  /* 공통 씬 ─────── */
  { id:2,
    text:`"잘했습니다."\n\n리온이 훈련 종료 후 당신을 불러 세운다.\n\n"신입 요원의 절반은 이 단계에서 포기합니다. 자신이 두려워서요. 당신은 달라 보입니다."\n\n그는 파일 하나를 건넨다. 표지에는 '임무 지령서 1호'가 적혀 있다.\n\n"다음 주부터 현장에 나갑니다. 준비됐습니까?"`,
    choices:[
      { text:'"준비됐습니다."',         result:'자신감과 각오로 첫 임무를 받아들였다.',    statChanges:{mental:1,power:1}, next:'chapter_end' },
      { text:'"한 가지 더 연습하겠습니다."', result:'완전한 준비를 위해 한 단계 더.',     statChanges:{control:2}, next:'chapter_end' },
      { text:'"이 임무 혼자 처리할 수 있습니까?"', result:'"...할 수 있을 것 같군요."', statChanges:{power:1,mental:2,control:1}, next:'chapter_end', req:{stat:'control',min:6} },
    ]
  },
]},

{ id:3, title:'첫 임무', subtitle:'사라지는 사람들', scenes:[
  { id:0,
    text:`서울 마포구 일대에서 최근 3주 사이 17명이 사라졌다.\n\n공통점: 모두 초능력 각성자.\n\n당신과 지유는 마지막 실종자의 집을 수색한다. 쓰러진 의자, 엎어진 커피잔. 그러나 투쟁의 흔적은 없다. 자발적으로 떠난 것처럼 보인다.\n\n당신의 능력이 반응한다. 이 공간에 무언가가 남아 있다.`,
    choices:[
      { text:'능력을 집중해 공간의 잔상을 읽어낸다', result:'희미한 기억의 파편이 흘러 들어왔다.', statChanges:{mental:1,control:1}, next:1 },
      { text:'지유와 함께 상황을 분석한다',           result:'경험과 감각이 조각들을 맞춰나갔다.',   statChanges:{mental:2}, next:1 },

      { text:'👁️ 벽 너머까지 투시해 건물 전체를 스캔한다',         result:'옆집 천장 속에 감시 장비가 있었다.',     statChanges:{mental:3,control:1}, next:1, abilityReq:'clairvoyance' },
      { text:'🧠 공간에 남은 감정의 잔향을 읽는다',               result:'"두려움이 아니었다. 안도감이었어."',        statChanges:{mental:3}, next:1, abilityReq:'mindControl' },
      { text:'💠 예민해진 후각으로 최근 발자국을 추적한다',        result:'세 사람의 발자국. 혼자가 아니었다.',        statChanges:{power:1,mental:2}, next:1, abilityReq:'regeneration' },
    ]
  },
  { id:1,
    text:`단서를 추적해 한강변 폐창고에 도달한다.\n\n그 중심에 로브를 걸친 남자가 서 있다.\n\n**오라클(Oracle)**. 초능력자들을 세뇌해 자신의 집단으로 끌어들이는 정신조작 능력자.\n\n"왔군요." 그의 목소리는 기이하게 울린다. "당신도 갇혀 있는 건 마찬가지예요. AURA라는 새장 안에."`,
    choices:[
      { text:'"거짓말은 통하지 않습니다." — 능력을 발동한다', result:'단호한 의지로 흔들리지 않았다.', statChanges:{power:1,control:1}, next:2 },
      { text:'그의 말에 귀를 기울이며 정보를 수집한다',       result:'냉정하게 적의 정보를 캐냈다.',    statChanges:{mental:2}, next:2, req:{stat:'mental',min:6} },
      { text:'🌀 오라클 주변 금속 장치를 압박해 항복을 유도한다',  result:'물체들이 조여들었다. 그가 식은땀을 흘렸다.', statChanges:{power:2,control:2}, next:10, abilityReq:'telekinesis', req:{stat:'power',min:7} },
      { text:'👁️ 오라클의 거짓말을 즉시 간파하고 역으로 캐낸다', result:'"AURA가 두려운 거군요. 왜죠?"',              statChanges:{mental:3,control:1}, next:11, abilityReq:'clairvoyance' },
      { text:'🧠 오라클과 정신 대결을 벌여 그의 능력을 역이용한다', result:'오라클이 스스로 계획을 말하기 시작했다.', statChanges:{mental:2,control:3}, next:12, abilityReq:'mindControl', req:{stat:'mental',min:7} },
      { text:'💠 오라클의 공격을 몸으로 받아내며 정면 돌파한다',  result:'정신 공격이 통하지 않았다. 육체가 방패였다.', statChanges:{power:3}, next:13, abilityReq:'regeneration' },
    ]
  },
  /* 능력 전용 씬 ─────── */
  { id:10, abilityScene:'telekinesis',
    text:`창고 안의 금속 조각들이 일제히 떠오른다. 오라클을 둘러싼 철제 파이프, 나사, 와이어 — 모두 당신의 의지 아래.\n\n오라클이 처음으로 뒷걸음질한다. 그의 목소리가 흔들린다.\n\n"...AURA가 두려운 거 맞아. 나도 거기 있었으니까. **넥서스(Nexus)**라는 단어 들어봤어? 그들이 진짜 숨기는 것—"\n\n그는 말을 멈추고 연기 속으로 사라진다. 하지만 그 단어는 남는다. **넥서스.**`,
    choices:[{ text:'"넥서스." — 이름을 기억한다', result:'지유에게 말하자 그녀의 얼굴이 굳었다. "...어디서 들었어요?"', statChanges:{mental:2,power:1}, next:2 }]
  },
  { id:11, abilityScene:'clairvoyance',
    text:`오라클의 말 하나하나가 보인다. 거짓말은 빨갛게, 진실은 흰빛으로.\n\n그의 말 대부분은 빨갛다. 하지만 한 문장만 하얗게 빛난다.\n\n*"나도 AURA가 무섭다."*\n\n당신은 그의 눈 뒤를 들여다본다. 도망치는 사람의 눈이다. 맞서는 사람의 눈이 아니라.\n\n"당신, 사실 우리에게 잡히고 싶은 거죠?" 오라클이 굳는다. 그 순간 그는 연기 속으로 달아난다. 하지만 달아나기 직전 — 쪽지 한 장을 바닥에 떨어뜨린다. 주소가 적혀 있다.`,
    choices:[{ text:'쪽지를 줍는다', result:'지유가 주소를 보더니 작게 숨을 들이쉬었다. "이곳을 어떻게..."', statChanges:{mental:3,control:1}, next:2 }]
  },
  { id:12, abilityScene:'mindControl',
    text:`당신과 오라클의 정신이 맞닿는다.\n\n그의 기억이 흘러든다 — 오라클도 한때 AURA 요원이었다. 3년 전, 무언가를 보고 도망쳤다.\n\n그리고 이름 목록. 오라클이 세뇌한 사람들의 이름 중에 — 지유의 이름이 있다.\n\n당신은 그것을 감추고 오라클을 밀어낸다. 그는 고통스러운 신음과 함께 연기 속으로 사라진다.\n\n지유가 다가온다. "뭐가 보였어요?"`,
    choices:[
      { text:'"지유씨 이름을 봤습니다." — 직접 말한다', result:'지유가 긴 침묵 끝에 말했다. "...언젠간 말하려고 했어요."', statChanges:{mental:2,control:2}, next:2, tag:'jiyu_past' },
      { text:'"별거 없었습니다." — 일단 숨긴다',        result:'혼자 삼켰다. 하지만 시선이 달라졌다.',                   statChanges:{mental:1,control:2}, next:2 },
    ]
  },
  { id:13, abilityScene:'regeneration',
    text:`오라클의 정신 공격이 몰아친다. 정상적인 능력자였다면 그 자리에서 무너졌을 것이다.\n\n당신은 멀쩡하다.\n\n오라클이 눈을 크게 뜬다. "뭐야, 당신. 왜 통하지 않는 거야?"\n\n그는 두 번, 세 번 더 시도한다. 당신의 머릿속은 고통스럽지만 — 무너지지 않는다. 육체가 정신을 붙들고 있다.\n\n오라클이 뒤로 물러서며 중얼거린다. "...재생 계열이 정신 공격에 면역이라는 건 보고서에 없었는데." 그리고 달아난다.`,
    choices:[{ text:'천천히 고통을 소화하며 일어선다', result:'오라클이 떨어뜨린 통신 기기를 발견했다. 주파수가 살아 있다.', statChanges:{power:2,mental:2}, next:2 }]
  },
  /* 공통 씬 ─────── */
  { id:2,
    text:`대치가 끝난다. 오라클은 도주했지만 세뇌된 능력자 5명을 구출하는 데 성공했다.\n\n귀환하는 차 안에서 지유가 조용히 말한다.\n\n"수고했어요. 그런데 오라클 — 그가 한 말, 신경 쓰이지 않습니까?"\n\n*'AURA라는 새장.'*\n\n당신은 처음으로 조직의 목적에 의문을 품기 시작한다.`,
    choices:[
      { text:'"조직을 믿겠습니다."',                     result:'신뢰를 선택했다. 아직은.',          statChanges:{control:1,mental:1}, next:'chapter_end' },
      { text:'"조직에 대해 더 알아야겠습니다."',          result:'의문의 씨앗이 자라기 시작했다.',    statChanges:{mental:2}, next:'chapter_end' },
      { text:'"오라클이 달아난 방향 — 추적하겠습니다."', result:'"...좋아요. 같이 가죠."',           statChanges:{mental:2,power:1,control:1}, next:'chapter_end', req:{stat:'mental',min:8} },
    ]
  },

{ id:4, title:'균열', subtitle:'진실의 대가', scenes:[
  { id:0,
    text:`AURA 기지 깊숙한 곳. 당신은 우연히 금지 구역에 들어간다.\n\n서버실 화면에 수백 명의 초능력자 데이터가 정렬되어 있다. 당신의 이름도 있다: **[처분 가능 등급: B]**\n\n민의 이름: **[처분 가능 등급: A]**\n\n발소리가 들린다. 누군가 오고 있다.`,
    choices:[
      { text:'데이터를 복사하고 즉시 도주한다',    result:'증거를 확보했다.',                   statChanges:{mental:1,power:1}, next:1 },
      { text:'숨어서 누가 오는지 확인한다',        result:'지유였다.',                          statChanges:{control:1,mental:2}, next:1, tag:'spy_jiyu' },

      { text:'🌀 문을 잠그고 데이터를 전부 다운로드한다',       result:'발소리가 멈췄다 멀어졌다.',            statChanges:{control:2,power:1,mental:1}, next:10, abilityReq:'telekinesis' },
      { text:'👁️ 복도를 투시해 인원·동선을 파악한 후 빠져나간다', result:'3명, 10시 방향. 완벽한 탈출로.',      statChanges:{mental:2,control:2}, next:11, abilityReq:'clairvoyance' },
      { text:'🧠 다가오는 사람에게 혼란을 심어 방향을 돌린다',  result:'발소리가 반대편으로 멀어졌다.',        statChanges:{mental:3,control:2}, next:12, abilityReq:'mindControl', req:{stat:'mental',min:9} },
      { text:'💠 들켜도 괜찮다 — 데이터 다 챙기고 나간다',     result:'경비원이 눈빛에 압도당해 물러섰다.',   statChanges:{power:3,mental:1}, next:13, abilityReq:'regeneration' },
    ]

  /* 능력 전용 씬 ─────── */
  { id:10, abilityScene:'telekinesis',
    text:`문이 쾅 닫힌다. 자물쇠가 돌아가는 금속음.\n\n당신은 서버에서 데이터를 복사하면서 이상한 것을 발견한다. 일반 파티션 뒤에 숨겨진 또 하나의 파티션. 잠금 해제를 시도한다.\n\n열린다.\n\n안에는 단 하나의 파일. **[넥서스 프로토콜 — 상위 1%만 열람 가능]**\n\n내용은 암호화되어 있어 읽을 수 없다. 하지만 파일이 존재한다는 사실 자체가 — 이미 충분하다.`,

  },
  { id:11, abilityScene:'clairvoyance',
    text:`건물 전체가 보인다. 경비 세 명 — 북쪽, 동쪽, 계단. 완벽한 경로가 그려진다.\n\n달아나던 중, 지하 2층에서 한 번도 본 적 없는 방을 발견한다. 문에 표시가 없다. 열쇠도 없다.\n\n하지만 투시로 그 안이 보인다.\n\n침대 열두 개. 누군가 누워 있다. 움직이지 않는다. 숨은 쉬고 있다. 그 얼굴 중 하나 — 3개월 전 실종된 능력자의 얼굴과 같다.\n\n*격리가 아니라 — 보관이었다.*`,
    choices:[{ text:'그 방의 위치를 정확히 기억한다', result:'당신은 지유에게 그 방 이야기를 꺼냈다. 그녀는 눈을 감았다.', statChanges:{mental:3,control:1}, next:1 }]
  },
  { id:12, abilityScene:'mindControl',
    text:`발소리가 멈춘다.\n\n당신은 복도 너머 사람의 의식에 닿았다. 방향 감각을 흐리는 데 3초. 그는 왼쪽으로 돌아선다.\n\n그런데 그 접촉 순간 — 그의 감정이 흘러들어온다. 두려움. 혐오. 이곳에서 일하는 것이 싫다는 감정.\n\n*그도 알고 있었다. 이 건물에서 무슨 일이 벌어지는지.*\n\n발소리가 멀어진다. 당신은 그 감정의 무게를 안고 데이터를 들고 복도로 나선다.`,
    choices:[{ text:'그의 감정을 삼키고 앞으로 나아간다', result:'아군이 될 수 있는 사람이 있다는 것을 기억했다.', statChanges:{mental:2,control:2}, next:1 }]

function determineEnding(stats, tags) {
  if (ENDINGS.rampage.condition(stats,tags))             return 'rampage';
  if (ENDINGS.reform_hero_special.condition(stats,tags)) return 'reform_hero_special';
  if (ENDINGS.reform_hero.condition(stats,tags))         return 'reform_hero';
  if (ENDINGS.lone_guardian.condition(stats,tags))       return 'lone_guardian';
  return 'default_end';
}

function statColor(s){ return {power:'#ff6b6b',control:'#4fc3f7',mental:'#ce93d8'}[s]||'#fff'; }
function isVisible(c,ability){ return !c.abilityReq || c.abilityReq===ability; }
function isLocked(c,stats){ return !!c.req && (stats[c.req.stat]||0)<c.req.min; }
function applyChanges(cur,ch){ const n={...cur}; for(const[s,v] of Object.entries(ch||{})) if(n[s]!==undefined) n[s]=Math.max(0,Math.min(MAX_STAT,(n[s]||0)+(v||0))); return n; }

}

}

function AwakeningScreen({onChoose}){
  const [hovered,setHovered]=useState(null); const [chosen,setChosen]=useState(null);
  function pick(k){ if(chosen)return; setChosen(k); setTimeout(()=>onChoose(k),700); }
  return <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#080818,#120820)',padding:'24px 16px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
    <div style={{maxWidth:620,width:'100%',animation:'fadeIn 0.6s ease'}}>
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{fontSize:11,letterSpacing:4,color:'#7c4dff',marginBottom:8}}>능력 각성</div>
        <h2 style={{fontSize:26,color:'#fff',marginBottom:10}}>무엇이 각성했는가</h2>
        <p style={{color:'#7070a0',fontSize:13,lineHeight:1.8}}>내면에서 여러 가능성이 솟구칩니다.<br/>하나를 선택하세요. 이것이 당신의 첫 번째 정체성입니다.</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}}>
        {Object.entries(ABILITIES).map(([k,ab])=>{
          const active=hovered===k||chosen===k;
          return <div key={k} onMouseEnter={()=>setHovered(k)} onMouseLeave={()=>setHovered(null)} onClick={()=>pick(k)} style={{background:chosen===k?`${ab.color}20`:active?'rgba(255,255,255,0.06)':'rgba(255,255,255,0.03)',border:`1px solid ${active?ab.color:'rgba(255,255,255,0.08)'}`,borderRadius:12,padding:20,cursor:chosen?'default':'pointer',transition:'all 0.3s ease',boxShadow:chosen===k?`0 0 28px ${ab.color}40`:'none'}}>
            <div style={{fontSize:32,marginBottom:8}}>{ab.emoji}</div>
            <div style={{fontSize:17,fontWeight:'bold',color:ab.color,marginBottom:6}}>{ab.name}</div>
            <div style={{fontSize:12,color:'#7070a0',lineHeight:1.7,marginBottom:10}}>{ab.desc}</div>
            <div style={{fontSize:11,color:'#505070',fontStyle:'italic',marginBottom:12}}>"{ab.flavor}"</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,fontSize:11}}>
              {ab.initStats.power>0&&<span style={{color:'#ff6b6b'}}>⚡ 파워 +{ab.initStats.power}</span>}
              {ab.initStats.control>0&&<span style={{color:'#4fc3f7'}}>🎯 컨트롤 +{ab.initStats.control}</span>}
              {ab.initStats.mental>0&&<span style={{color:'#ce93d8'}}>🧘 멘탈 +{ab.initStats.mental}</span>}
            </div>
          </div>;
        })}
      </div>
    </div>
  </div>;
}

function ChapterTransition({chapterNum,statChanges,stats,onContinue}){
  const ch=CHAPTERS[chapterNum-1]; const [show,setShow]=useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setShow(true),80); return()=>clearTimeout(t); },[]);
  return <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#080818,#0d1a0d)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24}}>
    <div style={{maxWidth:460,width:'100%',textAlign:'center',opacity:show?1:0,transform:show?'translateY(0)':'translateY(20px)',transition:'all 0.7s ease'}}>
      <div style={{fontSize:11,color:'#4caf50',letterSpacing:4,marginBottom:8}}>챕터 {chapterNum} 완료</div>
      <h2 style={{fontSize:22,color:'#fff',marginBottom:4}}>{ch?.title}</h2>
      <div style={{fontSize:13,color:'#505050',marginBottom:28}}>{ch?.subtitle}</div>
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid rgba(76,175,80,0.25)',borderRadius:12,padding:20,marginBottom:24}}>
        <div style={{fontSize:12,color:'#4caf50',marginBottom:14}}>능력 성장</div>
        {['power','control','mental'].map(stat=>{
          const labels={power:'⚡ 파워',control:'🎯 컨트롤',mental:'🧘 멘탈'}; const v=statChanges[stat]||0;
          return <div key={stat} style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}><span style={{color:'#9090b0'}}>{labels[stat]}</span><span style={{color:v>0?'#4caf50':v<0?'#f44336':'#5050a0'}}>{v>0?`+${v}`:v<0?v:'—'} → {stats[stat]}</span></div>
            <div style={{background:'#1a1a3a',borderRadius:4,height:6}}><div style={{width:`${(stats[stat]/MAX_STAT)*100}%`,height:'100%',background:statColor(stat),borderRadius:4,transition:'width 1s ease'}}/></div>
          </div>;
        })}
      </div>
      <button onClick={onContinue} style={{padding:'13px 40px',background:'linear-gradient(135deg,#4caf50,#2e7d32)',border:'none',borderRadius:10,color:'#fff',fontSize:15,fontWeight:'bold',cursor:'pointer',fontFamily:'inherit',letterSpacing:1}}>다음 챕터로 →</button>
    </div>
  </div>;
}

function StoryScreen({chapter,scene,stats,ability,playerName,chapterNum,onChoice}){
  const [flash,setFlash]=useState(''); const [locked,setLocked]=useState(false);
  const ab=ABILITIES[ability];
  function parseText(t){ return t.split(/(\*\*[^*]+\*\*)/g).map((p,i)=>p.startsWith('**')?<strong key={i} style={{color:'#e0e0ff'}}>{p.slice(2,-2)}</strong>:p); }
  function handleClick(c){ if(locked||isLocked(c,stats))return; setLocked(true); setFlash(c.result); setTimeout(()=>{ setFlash(''); setLocked(false); onChoice(c); },1400); }
  const visible=scene.choices.filter(c=>isVisible(c,ability));
  const hasAbChoice=visible.some(c=>c.abilityReq); const hasCommon=visible.some(c=>!c.abilityReq);
  /* 능력 전용 씬인지 */
  const isAbilityOnlyScene=!!scene.abilityScene;

  return <div style={{minHeight:'100vh',background:'linear-gradient(180deg,#080818 0%,#0a0a20 100%)',padding:16,display:'flex',flexDirection:'column',alignItems:'center'}}>
    <div style={{maxWidth:600,width:'100%'}}>
      <HUD stats={stats} ability={ability} playerName={playerName} chapterNum={chapterNum}/>
      <div style={{marginBottom:14,paddingBottom:10,borderBottom:'1px solid #1a1a3a'}}>
        <div style={{fontSize:11,color: isAbilityOnlyScene?(ab?.color||'#7c4dff'):'#7c4dff',letterSpacing:3}}>
          {isAbilityOnlyScene?`${ab?.emoji} ${ab?.name} 전용 — `:''}챕터 {chapterNum} — {chapter.title}
        </div>
      </div>
      <div style={{background: isAbilityOnlyScene?`${ab?.color}0a`:'rgba(255,255,255,0.03)',border:`1px solid ${isAbilityOnlyScene?(ab?.color+'30'):'#181828'}`,borderRadius:12,padding:'20px 24px',marginBottom:18,fontSize:14,lineHeight:1.95,color:'#b0b0d0',whiteSpace:'pre-line',animation:'fadeIn 0.4s ease'}}>
        {parseText(scene.text)}
      </div>
      {flash&&<div style={{background:'rgba(124,77,255,0.1)',border:'1px solid rgba(124,77,255,0.3)',borderRadius:8,padding:'12px 16px',marginBottom:14,fontSize:13,color:'#b090ff',fontStyle:'italic',animation:'fadeIn 0.3s ease'}}>{flash}</div>}
      {!locked&&<div style={{display:'flex',flexDirection:'column',gap:10,animation:'fadeIn 0.4s ease'}}>
        {hasAbChoice&&hasCommon&&<div style={{fontSize:10,color:ab?.color,letterSpacing:2,padding:'4px 0',display:'flex',alignItems:'center',gap:8,opacity:0.7}}><span style={{flex:1,height:1,background:`${ab?.color}40`}}/>{ab?.emoji} {ab?.name} 전용<span style={{flex:1,height:1,background:`${ab?.color}40`}}/></div>}
        {visible.map((c,i)=>{
          const isAb=!!c.abilityReq; const lock=isLocked(c,stats);
          const border=isAb?`${ab?.color}70`:lock?'rgba(50,50,70,0.5)':'rgba(124,77,255,0.35)';
          const bg=isAb?`${ab?.color}10`:'rgba(255,255,255,0.04)';
          return <button key={i} onClick={()=>handleClick(c)} style={{padding:'14px 18px',background:bg,border:`1px solid ${border}`,borderRadius:10,color:lock?'#454560':isAb?'#e0e0ff':'#c8c8e8',fontSize:13,lineHeight:1.5,cursor:lock?'not-allowed':'pointer',textAlign:'left',fontFamily:'inherit',transition:'background 0.2s ease',display:'flex',alignItems:'flex-start',gap:12}}
            onMouseEnter={e=>!lock&&(e.currentTarget.style.background=isAb?`${ab?.color}20`:'rgba(124,77,255,0.12)')}
            onMouseLeave={e=>!lock&&(e.currentTarget.style.background=bg)}>
            <span style={{color:lock?'#303050':isAb?ab?.color:'#7c4dff',fontWeight:'bold',minWidth:18}}>{String.fromCharCode(65+i)}</span>
            <span>
              {c.text}
              {lock&&<span style={{display:'block',fontSize:11,color:'#e57373',marginTop:4}}>🔒 {c.req.stat==='power'?'파워':c.req.stat==='control'?'컨트롤':'멘탈'} {c.req.min} 이상 필요</span>}
              {!lock&&<span style={{display:'block',fontSize:11,marginTop:4,opacity:0.65}}>{Object.entries(c.statChanges||{}).map(([s,v])=><span key={s} style={{color:v>0?'#81c784':'#e57373',marginRight:8}}>{s==='power'?'⚡':s==='control'?'🎯':'🧘'}{v>0?`+${v}`:v}</span>)}</span>}
            </span>
          </button>;
        })}
      </div>}
    </div>
  </div>;
}

function EndingScreen({endingKey,stats,ability,playerName,onRestart}){
  const ending=ENDINGS[endingKey]; const ab=ABILITIES[ability]; const [show,setShow]=useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setShow(true),200); return()=>clearTimeout(t); },[]);
  return <div style={{minHeight:'100vh',background:`linear-gradient(135deg,#080818 0%,${ending.color}12 100%)`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24}}>
    <div style={{maxWidth:500,width:'100%',textAlign:'center',opacity:show?1:0,transform:show?'translateY(0)':'translateY(20px)',transition:'all 0.8s ease'}}>
      <div style={{fontSize:52,marginBottom:16}}>{ending.emoji}</div>
      <div style={{fontSize:11,color:ending.color,letterSpacing:4,marginBottom:8}}>ENDING</div>
      <h2 style={{fontSize:24,color:'#fff',marginBottom:24,textShadow:`0 0 24px ${ending.color}70`}}>{ending.title}</h2>
      <div style={{background:'rgba(255,255,255,0.04)',border:`1px solid ${ending.color}28`,borderRadius:12,padding:24,marginBottom:22,fontSize:14,lineHeight:2,color:'#b0b0d0',whiteSpace:'pre-line',textAlign:'left'}}>{ending.description}</div>
      <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid #252535',borderRadius:12,padding:20,marginBottom:24}}>
        <div style={{fontSize:12,color:'#5050a0',marginBottom:14}}>최종 스탯 — {ab?.emoji} {playerName}</div>
        {[['power','⚡ 파워'],['control','🎯 컨트롤'],['mental','🧘 멘탈']].map(([s,l])=><div key={s} style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}><span style={{color:'#8080a0'}}>{l}</span><span style={{color:statColor(s)}}>{stats[s]}</span></div>
          <div style={{background:'#1a1a3a',borderRadius:4,height:6}}><div style={{width:`${(stats[s]/MAX_STAT)*100}%`,height:'100%',background:statColor(s),borderRadius:4}}/></div>
        </div>)}
      </div>
      <button onClick={onRestart} style={{padding:'13px 40px',background:'rgba(255,255,255,0.05)',border:`1px solid ${ending.color}40`,borderRadius:10,color:'#b0b0d0',fontSize:14,cursor:'pointer',fontFamily:'inherit',letterSpacing:1,transition:'background 0.2s ease'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.1)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,0.05)'}>처음부터 다시하기</button>
    </div>
  </div>;
}

/* ─── Main Game ─── */
function Game(){
  const [screen,setScreen]=useState('title');
  const [playerName,setName]=useState('');
  const [ability,setAbility]=useState(null);
  const [stats,setStats]=useState({power:0,control:0,mental:0});
  const [chapterIdx,setChIdx]=useState(0);
  const [sceneId,setSceneId]=useState(0);   // 씬 id 기반 탐색
  const [tags,setTags]=useState([]);
  const [chDelta,setChDelta]=useState({power:0,control:0,mental:0});
  const [endingKey,setEndKey]=useState(null);

  function onAwakening(k){ setAbility(k); setStats({...ABILITIES[k].initStats}); setScreen('story'); }

  function onChoice(c){
    const ns=applyChanges(stats,c.statChanges);
    setStats(ns);
    const d={...chDelta};
    for(const[s,v] of Object.entries(c.statChanges||{})) if(d[s]!==undefined) d[s]=(d[s]||0)+(v||0);
    setChDelta(d);
    const nt=c.tag?[...tags,c.tag]:tags;
    setTags(nt);
    if(c.next==='chapter_end') setScreen('transition');
    else if(c.next==='ending'){ setEndKey(determineEnding(ns,nt)); setScreen('ending'); }
    else setSceneId(c.next);  // id로 이동
  }

  function onTransitionContinue(){
    const next=chapterIdx+1;
    if(next>=CHAPTERS.length){ setEndKey(determineEnding(stats,tags)); setScreen('ending'); }
    else{ setChIdx(next); setSceneId(0); setChDelta({power:0,control:0,mental:0}); setScreen('story'); }
  }

  function onRestart(){ setScreen('title');setName('');setAbility(null);setStats({power:0,control:0,mental:0});setChIdx(0);setSceneId(0);setTags([]);setChDelta({power:0,control:0,mental:0});setEndKey(null); }

  const chapter=CHAPTERS[chapterIdx];
  /* id 기반 씬 탐색 */
  const scene=chapter?.scenes.find(s=>s.id===sceneId);

  if(screen==='title')     return <TitleScreen onStart={n=>{setName(n);setScreen('awakening');}}/>;
  if(screen==='awakening') return <AwakeningScreen onChoose={onAwakening}/>;
  if(screen==='story'&&chapter&&scene) return <StoryScreen chapter={chapter} scene={scene} stats={stats} ability={ability} playerName={playerName} chapterNum={chapterIdx+1} onChoice={onChoice}/>;
  if(screen==='transition') return <ChapterTransition chapterNum={chapterIdx+1} statChanges={chDelta} stats={stats} onContinue={onTransitionContinue}/>;
  if(screen==='ending')     return <EndingScreen endingKey={endingKey} stats={stats} ability={ability} playerName={playerName} onRestart={onRestart}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Game/>);
</script>
</body>
