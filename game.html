/* =====================================================================
   HELPERS
   ===================================================================== */

/* 엔딩 결정: 우선순위 순서대로 체크 */
function determineEnding(stats, tags) {
  if (ENDINGS.rampage.condition(stats, tags))             return 'rampage';
  if (ENDINGS.reform_hero_special.condition(stats, tags)) return 'reform_hero_special';
  if (ENDINGS.reform_hero.condition(stats, tags))         return 'reform_hero';
  if (ENDINGS.lone_guardian.condition(stats, tags))       return 'lone_guardian';
  return 'default_end';
}

function statColor(stat) {
  return { power: '#ff6b6b', control: '#4fc3f7', mental: '#ce93d8' }[stat] || '#fff';
}

/* 능력 전용 여부: abilityReq가 있으면 해당 능력이어야 표시 */
function isVisible(choice, ability) {
  if (!choice.abilityReq) return true;
  return choice.abilityReq === ability;
}

/* 스탯 관문 통과 여부: req가 있고 스탯이 부족하면 잠김 */
function isLocked(choice, stats) {
  if (!choice.req) return false;
  return (stats[choice.req.stat] || 0) < choice.req.min;
}

/* 스탯 변화 적용 (0~MAX_STAT 유지) */
function applyChanges(current, changes) {
  const next = { ...current };
  for (const [s, v] of Object.entries(changes || {})) {
    if (next[s] !== undefined) next[s] = Math.max(0, Math.min(MAX_STAT, (next[s] || 0) + (v || 0)));
  }
  return next;
}

}

function StoryScreen({ chapter, scene, stats, ability, playerName, chapterNum, onChoice }) {
  const [flash, setFlash] = useState('');
  const [locked, setLocked] = useState(false);
  const ab = ABILITIES[ability];

  function parseText(text) {
    return text.split(/(\*\*[^*]+\*\*)/g).map((p,i)=>
      p.startsWith('**') ? <strong key={i} style={{ color:'#e0e0ff' }}>{p.slice(2,-2)}</strong> : p
    );
  }

  function handleClick(choice) {
    if (locked || isLocked(choice, stats)) return;
    setLocked(true);
    setFlash(choice.result);
    setTimeout(()=>{ setFlash(''); setLocked(false); onChoice(choice); }, 1400);
  }

  /* 능력 전용 선택지인지 판별 */
  function isAbilityChoice(choice) { return !!choice.abilityReq; }

  /* 표시할 선택지만 필터링 */
  const visibleChoices = scene.choices.filter(c => isVisible(c, ability));

  return (
    <div style={{ minHeight:'100vh', background:'linear-gradient(180deg,#080818 0%,#0a0a20 100%)', padding:16, display:'flex', flexDirection:'column', alignItems:'center' }}>
      <div style={{ maxWidth:600, width:'100%' }}>
        <HUD stats={stats} ability={ability} playerName={playerName} chapterNum={chapterNum} />

        <div style={{ marginBottom:14, paddingBottom:10, borderBottom:'1px solid #1a1a3a' }}>
          <div style={{ fontSize:11, color:'#7c4dff', letterSpacing:3 }}>챕터 {chapterNum} — {chapter.title}</div>
        </div>

        <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid #181828', borderRadius:12, padding:'20px 24px', marginBottom:18, fontSize:14, lineHeight:1.95, color:'#b0b0d0', whiteSpace:'pre-line', animation:'fadeIn 0.4s ease' }}>
          {parseText(scene.text)}
        </div>

        {flash && (
          <div style={{ background:'rgba(124,77,255,0.1)', border:'1px solid rgba(124,77,255,0.3)', borderRadius:8, padding:'12px 16px', marginBottom:14, fontSize:13, color:'#b090ff', fontStyle:'italic', animation:'fadeIn 0.3s ease' }}>
            {flash}
          </div>
        )}

        {!locked && (
          <div style={{ display:'flex', flexDirection:'column', gap:10, animation:'fadeIn 0.4s ease' }}>
            {/* 능력 전용 선택지 구분선 */}
            {visibleChoices.some(c=>isAbilityChoice(c)) && visibleChoices.some(c=>!isAbilityChoice(c)) && (
              <div style={{ fontSize:10, color: ab?.color, letterSpacing:2, padding:'4px 0', display:'flex', alignItems:'center', gap:8, opacity:0.7 }}>
                <span style={{ flex:1, height:1, background:`${ab?.color}40` }} />
                {ab?.emoji} {ab?.name} 전용
                <span style={{ flex:1, height:1, background:`${ab?.color}40` }} />
              </div>
            )}

            {visibleChoices.map((choice, i) => {
              const isAb = isAbilityChoice(choice);
              const lock = isLocked(choice, stats);
              const borderColor = isAb ? `${ab?.color}70` : lock ? 'rgba(50,50,70,0.5)' : 'rgba(124,77,255,0.35)';
              const bgColor = isAb ? `${ab?.color}10` : 'rgba(255,255,255,0.04)';
              const textColor = lock ? '#454560' : isAb ? '#e0e0ff' : '#c8c8e8';

              return (
                <button key={i} onClick={()=>handleClick(choice)} style={{ padding:'14px 18px', background:bgColor, border:`1px solid ${borderColor}`, borderRadius:10, color:textColor, fontSize:13, lineHeight:1.5, cursor:lock?'not-allowed':'pointer', textAlign:'left', fontFamily:'inherit', transition:'background 0.2s ease', display:'flex', alignItems:'flex-start', gap:12 }}
                  onMouseEnter={e=>!lock&&(e.currentTarget.style.background=isAb?`${ab?.color}20`:'rgba(124,77,255,0.12)')}
                  onMouseLeave={e=>!lock&&(e.currentTarget.style.background=bgColor)}
                >
                  <span style={{ color:lock?'#303050':isAb?ab?.color:'#7c4dff', fontWeight:'bold', minWidth:18 }}>
                    {String.fromCharCode(65+i)}
                  </span>
                  <span>
                    {choice.text}
                    {/* 잠긴 스탯 관문 표시 */}
                    {lock && (
                      <span style={{ display:'block', fontSize:11, color:'#e57373', marginTop:4 }}>
                        🔒 {choice.req.stat==='power'?'파워':choice.req.stat==='control'?'컨트롤':'멘탈'} {choice.req.min} 이상 필요
                      </span>
                    )}
                    {/* 스탯 변화 미리보기 */}
                    {!lock && (
                      <span style={{ display:'block', fontSize:11, marginTop:4, opacity:0.65 }}>
                        {Object.entries(choice.statChanges||{}).map(([s,v])=>(
                          <span key={s} style={{ color:v>0?'#81c784':'#e57373', marginRight:8 }}>
                            {s==='power'?'⚡':s==='control'?'🎯':'🧘'}{v>0?`+${v}`:v}
                          </span>
                        ))}
                      </span>
                    )}
                  </span>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

  const [playerName, setName] = useState('');
  const [ability, setAbility] = useState(null);
  const [stats, setStats]     = useState({ power:0, control:0, mental:0 });
  const [chapterIdx, setChIdx]= useState(0);
  const [sceneIdx, setScIdx]  = useState(0);
  const [tags, setTags]       = useState([]);
  const [chDelta, setChDelta] = useState({ power:0, control:0, mental:0 });
  const [endingKey, setEndKey]= useState(null);

  function onAwakening(key) {
    setAbility(key);
    setStats({ ...ABILITIES[key].initStats });
    setScreen('story');
  }

  function onChoice(choice) {
    const newStats = applyChanges(stats, choice.statChanges);
    setStats(newStats);

    /* 챕터 내 누적 변화량 */
    const delta = { ...chDelta };
    for (const [s,v] of Object.entries(choice.statChanges||{})) {
      if (delta[s]!==undefined) delta[s]=(delta[s]||0)+(v||0);
    }
    setChDelta(delta);

    const newTags = choice.tag ? [...tags, choice.tag] : tags;
    setTags(newTags);

    if (choice.next==='chapter_end') {
      setScreen('transition');
    } else if (choice.next==='ending') {
      setEndKey(determineEnding(newStats, newTags));
      setScreen('ending');
    } else {
      setScIdx(choice.next);
    }
  }

  function onTransitionContinue() {
    const next = chapterIdx+1;
    if (next>=CHAPTERS.length) {
      setEndKey(determineEnding(stats, tags));
      setScreen('ending');
    } else {
      setChIdx(next); setScIdx(0);
      setChDelta({ power:0, control:0, mental:0 });
      setScreen('story');
    }
  }

  function onRestart() {
    setScreen('title'); setName(''); setAbility(null);
    setStats({ power:0, control:0, mental:0 });
    setChIdx(0); setScIdx(0); setTags([]);
    setChDelta({ power:0, control:0, mental:0 }); setEndKey(null);
  }

  const chapter = CHAPTERS[chapterIdx];
  const scene   = chapter?.scenes[sceneIdx];

  if (screen==='title')     return <TitleScreen onStart={n=>{setName(n);setScreen('awakening');}} />;
  if (screen==='awakening') return <AwakeningScreen onChoose={onAwakening} />;
  if (screen==='story'&&chapter&&scene)
    return <StoryScreen chapter={chapter} scene={scene} stats={stats} ability={ability} playerName={playerName} chapterNum={chapterIdx+1} onChoice={onChoice} />;
  if (screen==='transition')
    return <ChapterTransition chapterNum={chapterIdx+1} statChanges={chDelta} stats={stats} onContinue={onTransitionContinue} />;
  if (screen==='ending')
    return <EndingScreen endingKey={endingKey} stats={stats} ability={ability} playerName={playerName} onRestart={onRestart} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Game />);
</script>
</body>
</html>
